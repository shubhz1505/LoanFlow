server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: credit-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/loanflow_credit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: credit-service-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.loanflow.commons.events"
    producer:
      properties:
        spring.json.add.type.headers: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

ml:
  engine:
    base-url: ${ML_ENGINE_URL:http://localhost:9000}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:eureka-secret-2024@${EUREKA_HOST:localhost}:8761/eureka/
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${server.port}

resilience4j:
  circuitbreaker:
    instances:
      mlEngine:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      mlEngine:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      mlEngine:
        timeout-duration: 8s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

logging:
  level:
    com.loanflow.credit: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"